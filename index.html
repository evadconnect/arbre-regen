<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'arbre REGEN d'EVAD</title>

<!-- Polices : serif sobre pour les titres, sans-serif lisible pour le corps.
     Chargées via CDN léger, avec repli système pour un fonctionnement hors ligne. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   VARIABLES — toute la direction visuelle passe par ici.
   Modifie une couleur ici et elle se propage à l'arbre et à l'interface.
   ========================================================================= */
:root {
  /* --- Palette de l'arbre (constante entre les thèmes) --- */
  --forest: #1B3A2A;
  --green:  #2E7D4F;
  --green2: #3E9A63;
  --leaf:   #6CBF7A;
  --gold:   #F2B705;
  --cream:  #F6F2E7;
  --trunk:  #7A5230;
  --root:   #6B4A2B;
  --soil:   #DFCFB2;
  --ink:    #1B3A2A;

  /* --- Typographie --- */
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sans:  "Satoshi", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* --- Surfaces sensibles au thème (voir [data-theme="dark"] plus bas) --- */
  --bg:          #EFF6F0;   /* fond de page */
  --sky-top:     #E9F5EF;   /* haut du ciel */
  --sky-bottom:  #F6F2E7;   /* bas du ciel, vers la terre */
  --soil-band:   #DFCFB2;   /* bande de terreau */
  --label:       #1B3A2A;   /* texte posé sur le ciel et le terreau */
  --panel-bg:    #FFFFFF;
  --panel-fg:    #1B3A2A;
  --panel-muted: #5A7364;
  --border:      rgba(46,102,66,0.16);
  --border-strong: rgba(46,102,66,0.32);
  --shadow:      0 8px 30px rgba(27,58,42,0.10);
}

/* Variante sombre : on ne change que les surfaces et le texte,
   la palette verte + or de l'arbre reste identique et ressort sur fond foncé. */
[data-theme="dark"] {
  --bg:          #0E1A13;
  --sky-top:     #12241A;
  --sky-bottom:  #0C1610;
  --soil-band:   #23180E;
  --label:       #DCEBE0;
  --panel-bg:    #15271D;
  --panel-fg:    #EAF3EC;
  --panel-muted: #9DB6A6;
  --border:      rgba(130,184,148,0.18);
  --border-strong: rgba(130,184,148,0.40);
  --shadow:      0 8px 30px rgba(0,0,0,0.35);
  --trunk:       #8A6038;
  --soil:        #3A2A18;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--panel-fg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

/* =========================================================================
   MISE EN PAGE
   ========================================================================= */
.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(1rem, 3vw, 2.5rem);
}

header.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: clamp(1rem, 2.5vw, 1.8rem);
}
.masthead h1 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  line-height: 1.05;
  margin: 0;
  color: var(--panel-fg);
  letter-spacing: -0.01em;
}
.masthead .tagline {
  margin: 0.35rem 0 0;
  color: var(--panel-muted);
  font-size: clamp(0.9rem, 1.6vw, 1.05rem);
  max-width: 46ch;
}

.theme-toggle {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--panel-fg);
  background: var(--panel-bg);
  border: 1px solid var(--border-strong);
  border-radius: 100px;
  padding: 0.5rem 1rem;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.theme-toggle:hover { border-color: var(--gold); }
.theme-toggle:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Deux colonnes : l'arbre à gauche, le panneau à droite. */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.9fr);
  gap: clamp(1rem, 2.5vw, 2rem);
  align-items: start;
}

.tree-wrap {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 78%, var(--soil-band) 78%);
  border: 1px solid var(--border);
  border-radius: 32px;
  padding: clamp(0.5rem, 1.5vw, 1rem);
  overflow: hidden;
}
.tree-wrap svg {
  display: block;
  width: 100%;
  height: auto;
}

/* --- Panneau latéral de détail --- */
.panel {
  position: sticky;
  top: 1.5rem;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: clamp(1.2rem, 2vw, 1.6rem);
  min-height: 320px;
}
.panel .eyebrow {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.68rem;
  color: var(--green2);
  margin: 0 0 0.5rem;
}
.panel h2 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.5rem;
  margin: 0 0 0.2rem;
  color: var(--panel-fg);
  letter-spacing: -0.01em;
}
.panel .sub {
  color: var(--green2);
  font-weight: 600;
  margin: 0 0 0.9rem;
}
.panel p { color: var(--panel-fg); margin: 0 0 0.9rem; }
.panel .deva {
  border-left: 3px solid var(--gold);
  padding: 0.7rem 0.9rem;
  background: color-mix(in srgb, var(--gold) 12%, transparent);
  border-radius: 8px;
  font-size: 0.95rem;
}
.panel .deva strong { color: var(--panel-fg); }
.panel .deva .glyph { color: var(--gold); font-weight: 700; }

/* Outils utilisés à l'étape : petites pastilles emoji-first. */
.panel .tools { margin: 1rem 0 0; }
.panel .tools .tools-title {
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
  font-size: 0.66rem; color: var(--panel-muted); margin: 0 0 0.5rem;
}
.panel .tools .tool-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; margin: 0; padding: 0; }
.panel .tools .tool-pills li {
  font-size: 0.82rem; font-weight: 600; color: var(--panel-fg);
  background: color-mix(in srgb, var(--green2) 12%, transparent);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 0.22rem 0.7rem;
}

.panel .legend { list-style: none; margin: 0.6rem 0 0; padding: 0; }
.panel .legend li {
  display: flex; align-items: baseline; gap: 0.55rem;
  font-size: 0.9rem; color: var(--panel-muted);
  padding: 0.28rem 0;
}
.panel .legend .dot {
  flex: none; width: 12px; height: 12px; border-radius: 50%;
  transform: translateY(1px);
}
.panel .hint { font-size: 0.85rem; color: var(--panel-muted); margin-top: 1rem; }

/* Image de pilier : vignette dégradée (placeholder, en attente de photographie réelle). */
.panel .pillar-img {
  display: flex; align-items: center; justify-content: center;
  height: 140px; margin: 0 0 1rem; border-radius: 12px;
  background: linear-gradient(135deg, var(--leaf), var(--green));
  border: 1px solid var(--border);
}
.panel .pillar-img span { font-size: 3.4rem; filter: drop-shadow(0 2px 6px rgba(27,58,42,0.25)); }

/* Sections structurées d'une étape : Définition, Outils, Coopétiteurs. */
.panel .field { margin: 1rem 0 0; }
.panel .field h3 {
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
  font-size: 0.66rem; color: var(--green2); margin: 0 0 0.35rem;
}
.panel .field p { margin: 0; font-size: 0.92rem; color: var(--panel-fg); }
.panel .field .tool-list {
  margin: 0 0 0.7rem; padding: 0; list-style: none;
}
.panel .field .tool-list li {
  position: relative; padding: 0.18rem 0 0.18rem 1.1rem;
  font-size: 0.92rem; color: var(--panel-fg);
}
.panel .field .tool-list li::before {
  content: ""; position: absolute; left: 0; top: 0.62rem;
  width: 6px; height: 6px; border-radius: 50%; background: var(--green2);
}
.panel .field .deva { margin: 0; font-size: 0.9rem; }
.panel .field strong { color: var(--panel-fg); font-weight: 700; }
.panel .field em { color: var(--green2); font-style: normal; font-weight: 700; }

/* =========================================================================
   ÉLÉMENTS SVG INTERACTIFS
   ========================================================================= */
/* Branches (feuilles rondes) : agrandissement doux au survol/focus/sélection. */
.branch {
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.25s ease;
}
.branch:hover,
.branch:focus-visible,
.branch.is-active { transform: scale(1.12); }
.branch:focus-visible { outline: none; }
.branch:focus-visible .leaf-disc,
.branch.is-active .leaf-disc { filter: drop-shadow(0 0 10px rgba(242,183,5,0.55)); }
.branch .leaf-disc { transition: filter 0.25s ease; }

/* Racines : mise en avant du pilier au survol/focus. */
.root { cursor: pointer; }
.root:focus-visible { outline: none; }
.root .root-stroke { transition: stroke 0.18s ease, stroke-width 0.18s ease; }
.root .root-label { transition: fill 0.18s ease, font-weight 0.18s ease; }
.root:hover .root-stroke,
.root:focus-visible .root-stroke,
.root.is-hot .root-stroke { stroke: var(--gold); }
.root:hover .root-label,
.root:focus-visible .root-label,
.root.is-hot .root-label { fill: var(--gold); font-weight: 700; }

/* Soleil en thème clair, lune en thème sombre. */
.moon { display: none; }
[data-theme="dark"] .sun { display: none; }
[data-theme="dark"] .moon { display: block; }

/* Sève : flux doré en pointillé qui monte des racines vers les branches. */
.sap {
  fill: none;
  stroke: var(--gold);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 3 15;
  opacity: 0.8;
  pointer-events: none;
  animation: sap-rise 7s linear infinite;
}
.sap-b { stroke-width: 3.5; opacity: 0.68; }
.sap-flow { cursor: pointer; }
.sap-flow:focus-visible { outline: none; }
.sap-flow:hover .sap,
.sap-flow:focus-visible .sap {
  opacity: 1;
  stroke-width: 5;
  filter: drop-shadow(0 0 5px rgba(242,183,5,0.7));
}
@keyframes sap-rise { to { stroke-dashoffset: -180; } }

/* Oiseau et papillon : décoratifs, ne captent pas la souris. */
.bird, .butterfly { pointer-events: none; }
.bird-move {
  transform-box: fill-box; transform-origin: center;
  animation: bird-fly 15s ease-in-out infinite;
}
@keyframes bird-fly {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-34px,16px); }
  50%  { transform: translate(-66px,-8px); }
  75%  { transform: translate(-30px,12px); }
  100% { transform: translate(0,0); }
}
.bird-wing {
  transform-box: fill-box; transform-origin: bottom;
  animation: bird-flap 0.55s ease-in-out infinite;
}
@keyframes bird-flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

.bfly-move {
  transform-box: fill-box; transform-origin: center;
  animation: bfly-drift 11s ease-in-out infinite;
}
@keyframes bfly-drift {
  0%   { transform: translate(0,0) rotate(0deg); }
  30%  { transform: translate(30px,-24px) rotate(7deg); }
  60%  { transform: translate(54px,8px) rotate(-5deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}
.wing-l { transform-box: fill-box; transform-origin: right center; animation: bfly-flap 0.4s ease-in-out infinite; }
.wing-r { transform-box: fill-box; transform-origin: left center;  animation: bfly-flap 0.4s ease-in-out infinite; }
@keyframes bfly-flap { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.32); } }

/* Feuilles qui tombent : chaque feuille dérive vers le bas, tourne et s'efface,
   puis reparaît en haut. Le groupe entier est survolable/focusable. */
.loop-leaves { cursor: pointer; }
.loop-leaves:focus-visible { outline: none; }
.leaf-fall {
  transform-box: fill-box;
  transform-origin: center;
  animation: leaf-fall var(--t, 6s) linear infinite;
  animation-delay: var(--d, 0s);
}
.loop-leaves:hover .leaf-fall,
.loop-leaves:focus-visible .leaf-fall {
  filter: drop-shadow(0 0 6px rgba(242,183,5,0.65));
}
@keyframes leaf-fall {
  0%   { transform: translate(0, -22px) rotate(-12deg); opacity: 0; }
  15%  { opacity: 0.95; }
  85%  { opacity: 0.95; }
  100% { transform: translate(16px, 60px) rotate(96deg); opacity: 0; }
}

/* Respect de la frugalité et de l'accessibilité : aucune animation si l'utilisateur
   a demandé à réduire le mouvement. */
@media (prefers-reduced-motion: reduce) {
  .branch, .leaf-fall, .sap,
  .bird-move, .bird-wing, .bfly-move, .wing-l, .wing-r { animation: none !important; transition: none !important; }
  .leaf-fall { opacity: 0.95; }
}

/* =========================================================================
   RESPONSIVE — sur mobile l'arbre se recentre, le panneau passe dessous.
   ========================================================================= */
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .panel { position: static; }
  .tree-wrap svg { max-width: 560px; margin: 0 auto; }
}
</style>
</head>

<body>
<div class="page">

  <header class="masthead">
    <div>
      <h1>L'arbre REGEN</h1>
      <p class="tagline">L'écosystème régénératif de demain, prend racine aujourd'hui.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">Thème sombre</button>
  </header>

  <div class="layout">

    <!-- ================================================================
         L'ARBRE (SVG inline). Lecture de bas en haut :
         terreau → racines → tronc → branches → feuillage.
         La boucle du vivant redescend du feuillage vers les racines.
         ================================================================ -->
    <div class="tree-wrap">
      <svg viewBox="0 0 980 1055" role="img"
           aria-label="Arbre REGEN d'EVAD. De bas en haut : cinq racines (les piliers), le tronc de la mission, la sève dorée de Deva, cinq branches numérotées du parcours REGEN, et une boucle qui ramène les résultats aux racines.">

        <defs>
          <!-- Dégradé du feuillage -->
          <radialGradient id="canopyGrad" cx="50%" cy="45%" r="65%">
            <stop offset="0%"  stop-color="var(--leaf)"/>
            <stop offset="100%" stop-color="var(--green)"/>
          </radialGradient>
          <!-- Dégradé des feuilles-étapes -->
          <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="var(--green2)"/>
            <stop offset="100%" stop-color="var(--green)"/>
          </linearGradient>
          <!-- Soleil doux -->
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="var(--gold)" stop-opacity="0.95"/>
            <stop offset="55%" stop-color="var(--gold)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
          </radialGradient>
          <!-- Halo de la lune (thème sombre) -->
          <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#DCE9E2" stop-opacity="0.85"/>
            <stop offset="55%" stop-color="#DCE9E2" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#DCE9E2" stop-opacity="0"/>
          </radialGradient>
          <!-- Feuille réutilisable : sa couleur suit currentColor. -->
          <g id="leafGlyph">
            <path d="M0,-11 C7,-6 7,6 0,11 C-7,6 -7,-6 0,-11 Z" fill="currentColor"/>
            <path d="M0,-8 L0,8" stroke="var(--forest)" stroke-width="1" fill="none" opacity="0.4"/>
          </g>
        </defs>

        <!-- ===== SOLEIL doux (thème clair) / LUNE (thème sombre), sans étiquette ===== -->
        <g class="sun" aria-hidden="true">
          <circle cx="150" cy="130" r="95" fill="url(#sunGrad)"/>
          <circle cx="150" cy="130" r="34" fill="var(--gold)" opacity="0.9"/>
        </g>
        <g class="moon" aria-hidden="true">
          <circle cx="150" cy="130" r="90" fill="url(#moonGrad)"/>
          <!-- Croissant : un disque pâle échancré par un disque couleur ciel -->
          <circle cx="150" cy="130" r="34" fill="#DCE9E2" opacity="0.95"/>
          <circle cx="166" cy="122" r="28" fill="var(--sky-top)"/>
        </g>

        <!-- ===== FEUILLAGE : cercles verts qui se chevauchent ===== -->
        <g aria-hidden="true" opacity="0.96">
          <circle cx="450" cy="330" r="150" fill="url(#canopyGrad)" opacity="0.55"/>
          <circle cx="300" cy="380" r="115" fill="var(--green2)" opacity="0.45"/>
          <circle cx="610" cy="380" r="120" fill="var(--green2)" opacity="0.45"/>
          <circle cx="210" cy="450" r="90"  fill="var(--leaf)"  opacity="0.40"/>
          <circle cx="710" cy="450" r="92"  fill="var(--leaf)"  opacity="0.40"/>
          <circle cx="450" cy="230" r="105" fill="var(--leaf)"  opacity="0.42"/>
          <circle cx="380" cy="470" r="80"  fill="var(--green)" opacity="0.30"/>
          <circle cx="560" cy="470" r="82"  fill="var(--green)" opacity="0.30"/>
        </g>

        <!-- ===== TERREAU : bande de sol en bas ===== -->
        <rect x="0" y="845" width="980" height="210" fill="var(--soil-band)"/>

        <!-- ===== RACINES : les cinq piliers, le sol commun =====
             Chaque groupe .root est survolable/focusable et met en avant son pilier. -->
        <g id="roots">
          <g class="root" data-root="solarpunk" tabindex="0" role="button" aria-label="Pilier : Solarpunk">
            <path class="root-stroke" d="M450,850 C360,880 250,900 155,955" fill="none" stroke="var(--root)" stroke-width="12" stroke-linecap="round"/>
            <text class="root-label" x="120" y="1000" text-anchor="middle" font-family="var(--font-sans)" font-size="19" font-weight="700" fill="var(--label)">Solarpunk</text>
          </g>
          <g class="root" data-root="eco" tabindex="0" role="button" aria-label="Pilier : Économie régénérative">
            <path class="root-stroke" d="M450,852 C400,895 350,935 305,975" fill="none" stroke="var(--root)" stroke-width="12" stroke-linecap="round"/>
            <text class="root-label" x="300" y="1008" text-anchor="middle" font-family="var(--font-sans)" font-size="18" font-weight="700" fill="var(--label)">
              <tspan x="300" dy="0">Économie</tspan>
              <tspan x="300" dy="20">régénérative</tspan>
            </text>
          </g>
          <g class="root" data-root="game" tabindex="0" role="button" aria-label="Pilier : Gamification">
            <path class="root-stroke" d="M450,853 C452,905 450,945 450,988" fill="none" stroke="var(--root)" stroke-width="12" stroke-linecap="round"/>
            <text class="root-label" x="450" y="1032" text-anchor="middle" font-family="var(--font-sans)" font-size="19" font-weight="700" fill="var(--label)">Gamification</text>
          </g>
          <g class="root" data-root="gouv" tabindex="0" role="button" aria-label="Pilier : Gouvernance partagée">
            <path class="root-stroke" d="M450,852 C500,895 550,935 595,975" fill="none" stroke="var(--root)" stroke-width="12" stroke-linecap="round"/>
            <text class="root-label" x="600" y="1008" text-anchor="middle" font-family="var(--font-sans)" font-size="18" font-weight="700" fill="var(--label)">
              <tspan x="600" dy="0">Gouvernance</tspan>
              <tspan x="600" dy="20">partagée</tspan>
            </text>
          </g>
          <g class="root" data-root="coop" tabindex="0" role="button" aria-label="Pilier : Coopérisme">
            <path class="root-stroke" d="M450,850 C540,880 650,900 745,955" fill="none" stroke="var(--root)" stroke-width="12" stroke-linecap="round"/>
            <text class="root-label" x="780" y="1000" text-anchor="middle" font-family="var(--font-sans)" font-size="19" font-weight="700" fill="var(--label)">Coopérisme</text>
          </g>
        </g>

        <!-- ===== TRONC : la mission ===== -->
        <path d="M450,855 L450,545" fill="none" stroke="var(--trunk)" stroke-width="66" stroke-linecap="round"/>
        <!-- Texte du tronc, vertical, lu de bas en haut -->
        <text x="450" y="705" transform="rotate(-90 450 705)" text-anchor="middle"
              font-family="var(--font-serif)" font-size="24" font-weight="700"
              fill="var(--cream)" letter-spacing="0.02em">De l'idée à la preuve</text>

        <!-- ===== BRANCHES : les cinq étapes du parcours REGEN =====
             Traits épais depuis le tronc vers chaque feuille ronde numérotée. -->
        <g fill="none" stroke="var(--trunk)" stroke-linecap="round" aria-hidden="true">
          <path d="M450,560 Q320,540 210,495" stroke-width="16"/>
          <path d="M450,552 Q360,470 315,385" stroke-width="15"/>
          <path d="M450,548 Q450,440 450,330" stroke-width="16"/>
          <path d="M450,552 Q560,470 605,385" stroke-width="15"/>
          <path d="M450,560 Q600,540 710,495" stroke-width="16"/>
        </g>
        <!-- petites transitions vers le vert au bout des branches -->
        <g fill="none" stroke="var(--green)" stroke-linecap="round" aria-hidden="true">
          <path d="M320,540 Q265,518 210,495" stroke-width="12"/>
          <path d="M360,470 Q338,428 315,385" stroke-width="11"/>
          <path d="M450,440 L450,330" stroke-width="12"/>
          <path d="M560,470 Q583,428 605,385" stroke-width="11"/>
          <path d="M600,540 Q655,518 710,495" stroke-width="12"/>
        </g>

    <!-- ================================================================

<script>
/* =========================================================================
   DONNÉES — un objet par élément interactif. Facile à éditer.
   ========================================================================= */

// Les cinq branches : étapes du parcours REGEN.
const BRANCHES = {
  "1": { n: 1, verb: "Rêver", fn: "la vision", glyph: "💭",
    def: "Imaginer ensemble un futur désirable et en faire un cap partagé.",
    outils: {
      items: [
        "La vidéo de Vision d'EVAD comme déclencheur",
        "Un montage libre avec Kdenlive",
        "Un hébergement sobre sur PeerTube",
        "Un canevas ouvert type Excalidraw pour les collectifs qui dessinent"
      ],
      deva: "accompagne la conversation pour faire accoucher la vision du groupe, elle ne la rédige jamais." },
    coop: "Les animateurs d'ateliers d'imaginaire et de prise de conscience, La Fresque du Climat et 2tonnes, et le wiki Movilab qui documente les tiers-lieux et leurs récits. Ils cadrent l'intention collective, exactement l'étape Rêver." },
  "2": { n: 2, verb: "Explorer", fn: "le commun", glyph: "🧭",
    def: "Choisir des solutions régénératives déjà éprouvées, avec leurs indicateurs et leurs conditions de réussite, sans réinventer la roue.",
    outils: {
      items: [
        "Le Commun d'EVAD, alimenté par des bases externes plutôt que rempli à la main"
      ],
      deva: "cherche et cite sa source, elle n'invente jamais." },
    coop: "<em>Solutions :</em> le Low-tech Lab et sa base de données ouverte, la Fondation Solar Impulse et ses solutions labellisées par des experts indépendants, et Low-tech Magazine comme répertoire d'articles de fond.<br><em>Indicateurs :</em> la plateforme Commune Mesure, dédiée aux tiers-lieux, et l'Avise, qui distingue référentiels généralistes et sectoriels et renvoie aux Objectifs de développement durable." },
  "3": { n: 3, verb: "Générer", fn: "la modélisation", glyph: "🏗",
    def: "Créer votre propre projet en trois dimensions et le poser sur la carte, pour tester des scénarios et le rendre visible.",
    outils: {
      items: [
        "Le constructeur d'esquisse d'EVAD comme source de vérité",
        "Luanti pour l'immersion et l'implémentation",
        "uMap adossé à OpenStreetMap pour la carte, libres et frugaux"
      ],
      deva: "abaisse la barrière et place les blocs, elle ne choisit pas la solution." },
    coop: "La communauté OpenStreetMap France pour la donnée cartographique ouverte, et la communauté Luanti pour le moteur voxel libre. Des communs techniques, pas des fournisseurs, au plus près de la décentralisation." },
  "4": { n: 4, verb: "Entreprendre", fn: "les actions", glyph: "🛠️",
    def: "Passer du virtuel au réel, une action à la fois, guidé par un plan d'action découpé en petits pas atteignables.",
    outils: {
      items: [
        "La Gestion d'EVAD et son jumeau qui verdit",
        "Nextcloud pour la gestion documentaire",
        "Les outils de Framasoft pour l'agenda et la coordination, tous auto-hébergeables"
      ],
      deva: "découpe le prochain pas et séquence le plan d'action, elle n'exécute jamais." },
    coop: "France Tiers-Lieux et son réseau régional, qui accompagnent le passage à l'acte des lieux, et les têtes de réseau de l'économie sociale et solidaire locales. Des relais de terrain, parfois rivaux d'accompagnement, donc de vrais coopétiteurs." },
  "5": { n: 5, verb: "Nourrir", fn: "les preuves", glyph: "🎖",
    def: "Mesurer le changement dans le temps et prouver l'impact, pour transformer une intention en preuve vérifiée et auditable.",
    outils: {
      items: [
        "Le moteur de mesure d'EVAD, séparé de Deva, qui produit les indicateurs à partir des actes validés",
        "L'export vers les référentiels attendus"
      ],
      deva: "guide la collecte de preuves, elle ne calcule jamais le chiffre." },
    coop: "L'Observatoire des Tiers-Lieux de France Tiers-Lieux et sa cartographie d'outils d'évaluation, le référentiel Valor'ESS de l'UDES (quarante-trois indicateurs en treize dimensions), le référentiel d'impact des tiers-lieux ruraux de Familles Rurales et Eexiste, et le mouvement Impact France.<br><em>Côté financeurs :</em> les cadres ESRS, CSRD et les ODD comme langages de sortie." }
};

// Les cinq racines : les piliers, le sol commun.
const ROOTS = {
  solarpunk: { name: "Solarpunk", glyph: "☀️", line: "Un futur désirable, sobre et vivant, comme horizon commun." },
  eco:       { name: "Économie régénérative", glyph: "♻️", line: "Créer plus de vie qu'on en consomme." },
  game:      { name: "Gamification", glyph: "🎮", line: "Rendre l'action désirable, par les quêtes et les graines." },
  gouv:      { name: "Gouvernance partagée", glyph: "⚖️", line: "Décider ensemble, au plus près du terrain." },
  coop:      { name: "Coopérisme", glyph: "🤝", line: "Coopérer plutôt que rivaliser, et mutualiser la valeur." }
};

/* =========================================================================
   RENDU DU PANNEAU
   ========================================================================= */
const panelBody = document.getElementById("panelBody");

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// Vue par défaut : présentation + légende.
function renderDefault() {
  panelBody.innerHTML = `
    <p class="eyebrow">L'outil régénératif d'EVAD</p>
    <h2>Un seul organisme vivant</h2>
    <p class="sub">De l'idée à la preuve</p>
    <p>Lis l'arbre de bas en haut. Les racines sont les cinq piliers, le tronc porte la mission, et les cinq branches sont les étapes du parcours. La boucle ramène les résultats vérifiés vers les racines.</p>
    <ul class="legend">
      <li><span class="dot" style="background:var(--root)"></span> Racines : les cinq piliers</li>
      <li><span class="dot" style="background:var(--trunk)"></span> Tronc : la mission, de l'idée à la preuve</li>
      <li><span class="dot" style="background:var(--green2)"></span> Branches : les cinq étapes REGEN</li>
    </ul>
    <p class="hint">Survole, clique ou navigue au clavier (Tab, puis Entrée) sur le tronc, une branche ou une racine.</p>`;
}

// Vue d'une branche.
function renderBranch(id) {
  const b = BRANCHES[id];
  if (!b) return;
  panelBody.innerHTML = `
    <div class="pillar-img"><span>${b.glyph}</span></div>
    <p class="eyebrow">Branche ${b.n} sur 5</p>
    <h2>${esc(b.verb)}</h2>
    <p class="sub">${esc(b.fn)}</p>
    <div class="field"><h3>Définition</h3><p>${b.def}</p></div>
    <div class="field">
      <h3>Outils</h3>
      <ul class="tool-list">${b.outils.items.map(i => `<li>${i}</li>`).join("")}</ul>
      <p class="deva"><span class="glyph">✦</span> <strong>Deva</strong> ${b.outils.deva}</p>
    </div>
    <div class="field"><h3>Coopétiteurs</h3><p>${b.coop}</p></div>`;
}

// Vue d'une racine.
function renderRoot(key) {
  const r = ROOTS[key];
  if (!r) return;
  panelBody.innerHTML = `
    <div class="pillar-img"><span>${r.glyph}</span></div>
    <p class="eyebrow">Racine, un pilier</p>
    <h2>${esc(r.name)}</h2>
    <p>${esc(r.line)}</p>
    <p class="hint">Les cinq piliers forment le sol commun sur lequel pousse chaque lieu.</p>`;
}

// Vue du tronc (survol) : la mission, ce que fait EVAD. La sève relie racines et branches.
function renderTrunk() {
  panelBody.innerHTML = `
    <div class="pillar-img"><span>🌱</span></div>
    <p class="eyebrow">Le tronc, la mission</p>
    <h2>Ce que fait EVAD</h2>
    <p>EVAD accompagne chaque lieu de l'idée à la preuve : un parcours régénératif où l'on rêve une vision, explore le commun, génère une modélisation, passe aux actions et nourrit les preuves.</p>
    <p>Comme une sève, les cinq piliers (les racines) irriguent chaque étape (les branches). Deva éclaire et propose à chaque pas, l'humain décide toujours.</p>
    <p class="hint">Un seul organisme vivant, de l'idée à la preuve.</p>`;
}

// Vue de la boucle du vivant (survol des feuilles qui tombent).
function renderLoop() {
  panelBody.innerHTML = `
    <div class="pillar-img"><span>🍂</span></div>
    <p class="eyebrow">La boucle du vivant</p>
    <h2>Nourrir les racines</h2>
    <p>Les résultats vérifiés retournent au commun et nourrissent les racines.</p>
    <p class="hint">Comme les feuilles qui tombent enrichissent la terre, chaque preuve validée redescend alimenter les cinq piliers.</p>`;
}

/* =========================================================================
   INTERACTIONS
   ========================================================================= */
let pinned = null; // branche épinglée par un clic

// Revenir à l'état stable (branche épinglée sinon vue par défaut).
function restore() {
  if (pinned) renderBranch(pinned);
  else renderDefault();
}

// --- Branches ---
document.querySelectorAll(".branch").forEach(el => {
  const id = el.dataset.branch;
  // Survol et focus clavier : aperçu du détail.
  el.addEventListener("pointerenter", () => renderBranch(id));
  el.addEventListener("focus", () => renderBranch(id));
  el.addEventListener("pointerleave", restore);
  el.addEventListener("blur", restore);
  // Clic ou Entrée / Espace : épingler la branche.
  const select = () => {
    document.querySelectorAll(".branch").forEach(b => b.classList.remove("is-active"));
    el.classList.add("is-active");
    pinned = id;
    renderBranch(id);
  };
  el.addEventListener("click", select);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); }
  });
});

// --- Racines --- (survol / focus uniquement, non épinglables)
document.querySelectorAll(".root").forEach(el => {
  const key = el.dataset.root;
  const enter = () => { el.classList.add("is-hot"); renderRoot(key); };
  const leave = () => { el.classList.remove("is-hot"); restore(); };
  el.addEventListener("pointerenter", enter);
  el.addEventListener("focus", enter);
  el.addEventListener("pointerleave", leave);
  el.addEventListener("blur", leave);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
  });
});

// --- Sève (le tronc) --- survol / focus uniquement.
const sapFlow = document.querySelector(".sap-flow");
if (sapFlow) {
  sapFlow.addEventListener("pointerenter", renderTrunk);
  sapFlow.addEventListener("focus", renderTrunk);
  sapFlow.addEventListener("pointerleave", restore);
  sapFlow.addEventListener("blur", restore);
  sapFlow.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderTrunk(); }
  });
}

// --- Feuilles qui tombent (la boucle du vivant) --- survol / focus uniquement.
const loopLeaves = document.querySelector(".loop-leaves");
if (loopLeaves) {
  loopLeaves.addEventListener("pointerenter", renderLoop);
  loopLeaves.addEventListener("focus", renderLoop);
  loopLeaves.addEventListener("pointerleave", restore);
  loopLeaves.addEventListener("blur", restore);
  loopLeaves.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderLoop(); }
  });
}

/* =========================================================================
   BASCULE DE THÈME (clair / sombre via les variables)
   ========================================================================= */
const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  toggle.setAttribute("aria-pressed", String(!dark));
  toggle.textContent = dark ? "Thème sombre" : "Thème clair";
});

// État initial du panneau.
renderDefault();
</script>
